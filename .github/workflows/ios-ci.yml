name: iOS CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 --version
      - run: python3 scripts/verify-static.py
      - run: python3 scripts/test-automation.py
      - name: Check candidate whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)" HEAD
  ios:
    needs: static
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Select and assert Xcode
        shell: bash
        run: |
          if [[ -d /Applications/Xcode_26.6.app/Contents/Developer ]]; then
            export DEVELOPER_DIR=/Applications/Xcode_26.6.app/Contents/Developer
            echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          fi
          xcodebuild -version
          [[ $(xcodebuild -version | head -n 1) == 'Xcode 26.6' ]]
      - run: scripts/ci-ios.sh
      - uses: actions/upload-artifact@v7.0.1
        if: failure()
        with:
          name: ios-failure-${{ github.run_id }}
          path: |
            .ci-artifacts/**/*.log
            .ci-artifacts/**/*.xcresult
            .ci-artifacts/**/devices.json
          include-hidden-files: true
          retention-days: 7
